[package]
name = "enclose-strings"
version = "0.2.0"
edition = "2021"
description = "Wrap or enclose strings in matching or complementary characters with optional escaping"
repository = "https://github.com/neilg63/enclose-strings"
categories = ["text-processing", "parsing"]
license = "MIT"

[features]
default = []
# Opt-in inverse of SimpleEnclose: extract the content wrapped in bounding
# characters. Adds no dependencies, only compilation units.
extract = []

[dependencies]

[package.metadata.docs.rs]
all-features = true
